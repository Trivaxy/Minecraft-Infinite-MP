import org.gradle.jvm.toolchain.JavaToolchainService

import java.security.MessageDigest
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

import org.eclipse.jgit.api.Git
import org.eclipse.jgit.diff.DiffFormatter
import org.eclipse.jgit.dircache.DirCacheIterator
import org.eclipse.jgit.treewalk.FileTreeIterator

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r'
    }
}

// Vineflower needs a modern JVM, but the game itself is built on Java 8. It will not run on
// 8 at all. Measured: JDK 21 and JDK 25 produce byte-identical output, so the pin is not
// load-bearing between those two - it is here because only those two were checked, and a
// decompiler that shifts output on a future JDK would break every patch at once.
def DECOMPILER_JAVA = 21

def UPSTREAM = [
    client: [
        url   : 'https://github.com/VesuviusVenox/Minecraft-Infinite/releases/download/v1.0/v1.0.jar',
        sha256: '53d34c582302b20ad82d3d2bd5a3746bd6f3185f17ac39475ad3f3df0fe19867',
        file  : 'v1.0.jar',
    ],
    server: [
        url   : 'https://raw.githubusercontent.com/VesuviusVenox/Minecraft-Infinite/b7bc008ff8d13913fcbb08d703694a762a7be7cd/Server-FOR-DEV-WORK-ONLY.jar',
        sha256: '77fd2031206b541d9011d766f3e5d084de9c3cfcb707bb18c17b8b3f5e0d8681',
        file  : 'Server-FOR-DEV-WORK-ONLY.jar',
    ],
]

// Packages that are third-party rather than game code. They are re-jarred verbatim into
// libs/ and excluded from the decompile
def VENDOR = [
    'vendor-common': ['it/', 'org/json/'],
    'vendor-sound' : ['com/jcraft/', 'paulscode/'],
]
def GAME = ['net/', 'com/mojang/', 'ca/']

def GENERATED_MARKER = '# --- generated by ./gradlew capturePatch : the decompiled tree ---'

// java-base registers the toolchain service on the root project without creating any
// source sets. Captured at script scope because inside a task closure `javaToolchains`
// would resolve against the task rather than the project.
apply plugin: 'java-base'
def toolchains = project.extensions.getByType(JavaToolchainService)

def bootDir      = layout.buildDirectory.dir('bootstrap').get().asFile
def upstreamDir  = new File(bootDir, 'upstream')
def codeDir      = new File(bootDir, 'code')
def rawDir       = new File(bootDir, 'raw')
def baselineDir  = new File(bootDir, 'baseline')

def sha256 = { File f ->
    def md = MessageDigest.getInstance('SHA-256')
    f.withInputStream { ins ->
        byte[] buf = new byte[1 << 16]
        int n
        while ((n = ins.read(buf)) > 0) md.update(buf, 0, n)
    }
    md.digest().encodeHex().toString()
}

def copyTreeInto = { File src, File dst ->
    src.eachFileRecurse { f ->
        if (f.isFile()) {
            def rel = src.toPath().relativize(f.toPath()).toString()
            def out = new File(dst, rel)
            out.parentFile.mkdirs()
            out.bytes = f.bytes
        }
    }
}

def readLayout = {
    def moves = [], deletes = [], resources = [], normalize = []
    file('tools/layout.txt').eachLine('UTF-8') { line ->
        if (line.startsWith('#') || line.trim().isEmpty()) return
        def p = line.split('\t')
        switch (p[0]) {
            case 'M': moves << [p[1], p[2]]; break
            case 'D': deletes << p[1]; break
            case 'R': resources << [p[1], p[2]]; break
            case 'N': normalize << p[1]; break
        }
    }
    [moves: moves, deletes: deletes, resources: resources, normalize: normalize]
}

// Patches are always applied to a scratch tree under build/, never to a real repository:
// JGit's ApplyCommand stages what it applies, so pointing it at the project would add every
// patched file back into the index. The guard makes that mistake impossible to repeat.
// EOL translation is switched off on the scratch repo because three lang resources are CRLF
// inside the upstream jar. Left on (and the user's global core.autocrlf is inherited) the
// CR bytes in those hunks stop matching the file and the patch fails to apply
def applyPatch = { File tree, File patch ->
    def gitDir = new File(tree, '.git')
    if (gitDir.exists()) {
        throw new GradleException("applyPatch needs a scratch tree, but ${tree} is a repository")
    }
    Git git = Git.init().setDirectory(tree).call()
    try {
        def cfg = git.repository.config
        cfg.setString('core', null, 'autocrlf', 'false')
        cfg.setString('core', null, 'eol', 'lf')
        cfg.save()
        patch.withInputStream { ins -> git.apply().setPatch(ins).call() }
    } finally {
        git.close()
        delete(gitDir)
    }
}

tasks.register('fetchUpstream') {
    group = 'bootstrap'
    description = "Downloads Vesuvius's published client and server jars"

    outputs.files(UPSTREAM.values().collect { new File(upstreamDir, it.file) })

    doLast {
        upstreamDir.mkdirs()
        UPSTREAM.each { side, spec ->
            def target = new File(upstreamDir, spec.file)
            if (target.exists() && sha256(target) == spec.sha256) return
            logger.lifecycle("bootstrap: downloading ${spec.file}")
            target.withOutputStream { out ->
                new URI(spec.url).toURL().withInputStream { ins -> out << ins }
            }
            def got = sha256(target)
            if (got != spec.sha256) {
                target.delete()
                throw new GradleException(
                    "${spec.file} checksum mismatch.\n  expected ${spec.sha256}\n  got      ${got}\n" +
                    "Upstream may have republished it; the patches are pinned to the recorded build.")
            }
        }
    }
}

// Entries are sorted and their timestamps zeroed so the same input jar always produces the
// same output bytes.
def subsetJar = { File sourceJar, List prefixes, File out ->
    out.parentFile.mkdirs()
    def written = 0
    def source = new ZipFile(sourceJar)
    try {
        new ZipOutputStream(out.newOutputStream()).withCloseable { zos ->
            source.entries().findAll { e ->
                !e.directory && e.name.endsWith('.class') && prefixes.any { e.name.startsWith(it) }
            }.sort { it.name }.each { e ->
                def copy = new ZipEntry(e.name)
                copy.time = 0L
                zos.putNextEntry(copy)
                source.getInputStream(e).withStream { ins -> zos << ins }
                zos.closeEntry()
                written++
            }
        }
    } finally {
        source.close()
    }
    written
}

tasks.register('extractVendor') {
    group = 'bootstrap'
    description = 'Re-jars the third-party libraries out of the upstream jars'
    dependsOn 'fetchUpstream'

    outputs.files(VENDOR.keySet().collect { rootProject.file("libs/${it}.jar") })

    doLast {
        VENDOR.each { name, prefixes ->
            def n = subsetJar(new File(upstreamDir, UPSTREAM.client.file), prefixes,
                              rootProject.file("libs/${name}.jar"))
            logger.lifecycle("bootstrap: libs/${name}.jar (${n} classes)")
        }
    }
}

tasks.register('makeCodeJars') {
    group = 'bootstrap'
    description = 'Strips the upstream jars down to game classes for the decompiler'
    dependsOn 'fetchUpstream'

    outputs.files(['client', 'server'].collect { new File(codeDir, "${it}-code.jar") })

    doLast {
        UPSTREAM.each { side, spec ->
            def n = subsetJar(new File(upstreamDir, spec.file), GAME,
                              new File(codeDir, "${side}-code.jar"))
            logger.lifecycle("bootstrap: ${side}-code.jar (${n} classes)")
        }
    }
}

['client', 'server'].each { side ->
    tasks.register("decompile${side.capitalize()}", JavaExec) {
        group = 'bootstrap'
        description = "Decompiles the ${side} jar with Vineflower"
        dependsOn 'makeCodeJars', 'extractVendor'

        def outDir = new File(rawDir, side)
        inputs.file(new File(codeDir, "${side}-code.jar"))
        outputs.dir(outDir)

        classpath = configurations.vineflower
        mainClass = 'org.jetbrains.java.decompiler.main.decompiler.ConsoleDecompiler'
        javaLauncher = toolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(DECOMPILER_JAVA)
        }
        maxHeapSize = '4G'

        doFirst {
            delete(outDir)
            outDir.mkdirs()
            // -e= entries let Vineflower resolve types it does not decompile. rt.jar comes
            // from the Java 8 toolchain, which is the JDK the game is compiled against.
            def java8 = toolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }.get()
            def rt = new File(java8.metadata.installationPath.asFile, 'jre/lib/rt.jar')
            if (!rt.exists()) rt = new File(java8.metadata.installationPath.asFile, 'lib/rt.jar')

            def externals = [rt]
            externals += VENDOR.keySet().collect { rootProject.file("libs/${it}.jar") }
            externals += project(':client').configurations.compileClasspath.files.findAll {
                it.name =~ /lwjgl|jinput|jutils/
            }

            args = ['-dgs=1', '-rsy=1', '-ind=    '] +
                   externals.findAll { it.exists() }.collect { "-e=${it.absolutePath}".toString() } +
                   [new File(codeDir, "${side}-code.jar").absolutePath, outDir.absolutePath]
        }
    }
}

tasks.register('stageBaseline') {
    group = 'bootstrap'
    description = 'Builds the pre-patch baseline the working tree is derived from'
    dependsOn 'decompileClient', 'decompileServer'

    inputs.file('patches/0000-decompiler-fixes.patch')
    inputs.file('tools/layout.txt')
    outputs.dir(baselineDir)

    doLast {
        delete(baselineDir)
        ['client', 'server'].each { side ->
            copyTreeInto(new File(rawDir, side), new File(baselineDir, "${side}/src/main/java"))
        }

        applyPatch(baselineDir, file('patches/0000-decompiler-fixes.patch'))

        def lay = readLayout()
        lay.moves.each { src, dst ->
            def from = new File(baselineDir, src)
            def to = new File(baselineDir, dst)
            if (!from.exists()) throw new GradleException("layout: missing move source ${src}")
            to.parentFile.mkdirs()
            from.renameTo(to) || { to.bytes = from.bytes; from.delete() }()
        }
        lay.deletes.each { p -> new File(baselineDir, p).delete() }

        def source = new ZipFile(new File(upstreamDir, UPSTREAM.client.file))
        try {
            lay.resources.each { entry, dest ->
                def e = source.getEntry(entry)
                if (e == null) throw new GradleException("layout: ${entry} is not in the upstream jar")
                def out = new File(baselineDir, dest)
                out.parentFile.mkdirs()
                out.withOutputStream { os -> source.getInputStream(e).withStream { ins -> os << ins } }
            }
        } finally {
            source.close()
        }

        // A handful of resources are CRLF in the jar and LF in the tree. Patch hunks cannot
        // express that, so the normalisation is recorded in the layout instead.
        lay.normalize.each { p ->
            def f = new File(baselineDir, p)
            if (f.exists()) f.bytes = new String(f.bytes, 'UTF-8').replace('\r\n', '\n').getBytes('UTF-8')
        }

        logger.lifecycle("bootstrap: baseline staged (${lay.moves.size()} moves, " +
                         "${lay.deletes.size()} deletes, ${lay.resources.size()} resources)")
    }
}

tasks.register('bootstrap') {
    group = 'bootstrap'
    description = 'Regenerates the derived source tree from the upstream jars'
    dependsOn 'stageBaseline'

    doLast {
        // Patch 0001 is applied to a throwaway copy under build/, never to the project
        // directory. JGit's ApplyCommand stages what it applies, so pointing it at the real
        // repository would silently add every patched file back into the index.
        def stagedDir = new File(bootDir, 'staged')
        delete(stagedDir)
        copyTreeInto(baselineDir, stagedDir)
        applyPatch(stagedDir, file('patches/0001-content.patch'))

        ['core', 'client', 'server'].each { m ->
            delete(fileTree(rootProject.file("${m}/src/main")) {
                include 'java/**'
                include 'resources/**'
                exclude(rootProject.file('tools/authored.txt').exists()
                        ? rootProject.file('tools/authored.txt').readLines().findAll { it.startsWith("${m}/") }
                              .collect { it.substring("${m}/src/main/".length()) }
                        : [])
            })
        }
        copyTreeInto(stagedDir, rootProject.projectDir)

        def java = 0, res = 0
        ['core', 'client', 'server'].each { m ->
            def d = rootProject.file("${m}/src/main")
            if (d.exists()) d.eachFileRecurse { f ->
                if (f.isFile()) { f.name.endsWith('.java') ? java++ : res++ }
            }
        }
        logger.lifecycle("bootstrap: tree assembled - ${java} java files, ${res} resources")
    }
}

tasks.register('capturePatch') {
    group = 'bootstrap'
    description = 'Folds working-tree edits back into patches/0001-content.patch'
    dependsOn 'stageBaseline'

    doLast {
        def captureDir = new File(bootDir, 'capture')
        delete(captureDir)
        captureDir.mkdirs()

        Git git = Git.init().setDirectory(captureDir).call()
        try {
            def repo = git.repository
            def cfg = repo.config
            cfg.setString('core', null, 'autocrlf', 'false')
            cfg.setString('core', null, 'eol', 'lf')
            cfg.save()

            copyTreeInto(baselineDir, captureDir)
            git.add().addFilepattern('.').call()

            delete(fileTree(captureDir) { exclude '.git/**' })
            def tracked = [] as Set
            baselineDir.eachFileRecurse { f ->
                if (f.isFile()) tracked << baselineDir.toPath().relativize(f.toPath()).toString()
            }
            tracked.each { rel ->
                def src = rootProject.file(rel)
                if (src.exists()) {
                    def out = new File(captureDir, rel)
                    out.parentFile.mkdirs()
                    out.bytes = src.bytes
                }
            }

            def out = new ByteArrayOutputStream()
            new DiffFormatter(out).withCloseable { fmt ->
                fmt.setRepository(repo)
                fmt.setDetectRenames(false)
                fmt.format(new DirCacheIterator(repo.readDirCache()), new FileTreeIterator(repo))
            }
            file('patches/0001-content.patch').bytes = out.toByteArray()
            def files = out.toString('UTF-8').readLines().count { it.startsWith('diff --git') }
            logger.lifecycle("capturePatch: patches/0001-content.patch (${files} files)")

            def authored = [] as TreeSet
            ['core', 'client', 'server'].each { m ->
                def root = rootProject.file("${m}/src/main")
                if (!root.exists()) return
                root.eachFileRecurse { f ->
                    if (!f.isFile()) return
                    def rel = rootProject.projectDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                    if (!tracked.contains(rel.replace('/', File.separator)) && !tracked.contains(rel)) {
                        authored << rel
                    }
                }
            }
            file('tools/authored.txt').text = authored.join('\n') + '\n'

            def byDir = [:].withDefault { [] as TreeSet }
            tracked.each { rel ->
                def p = rel.replace('\\', '/')
                byDir[p.substring(0, p.lastIndexOf('/'))] << p
            }
            def authoredDirs = authored.collect { it.substring(0, it.lastIndexOf('/')) } as Set
            def rules = []
            byDir.keySet().sort().each { d ->
                if (authoredDirs.contains(d)) byDir[d].each { rules << "/${it}" }
                else rules << "/${d}/"
            }

            def gitignore = file('.gitignore')
            def keep = gitignore.text.split(GENERATED_MARKER)[0].trim()
            gitignore.text = keep + '\n\n' + GENERATED_MARKER + '\n' +
                '# Rebuilt by ./gradlew bootstrap from Vesuvius\'s published jars.\n' +
                '# The files this repository owns are listed in tools/authored.txt.\n' +
                '/libs/vendor-common.jar\n/libs/vendor-sound.jar\n' +
                rules.join('\n') + '\n'
            logger.lifecycle("capturePatch: ${authored.size()} authored files, ${rules.size()} ignore rules")
        } finally {
            git.close()
        }
    }
}
