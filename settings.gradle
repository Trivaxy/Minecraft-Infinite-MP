plugins {
    // Lets Gradle download a JDK 8 itself if the machine doesn't have one.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'minecraft-infinite'

// All the game code that is not a renderer and not a dedicated server.
include 'core'
include 'client'
include 'server'
