// Minecraft Infinite - development environment.
//
// Three modules:
//
//   :core    - the shared game. Blocks, items, entities, world gen, containers, recipes,
//              the protocol. Depends on neither of the other two.
//   :client  - renderer, GUI, particles, sound, input, options. Depends on :core.
//   :server  - MinecraftServer, console commands, entity tracking, bans. Depends on :core.
//
// The client and server were originally decompiled from the shipped jars as two independent
// trees carrying a full copy of the game each, kept in step by a `checkParity` task. That
// task is gone: the copies were reconciled and hoisted into :core, so the compiler now
// enforces what the task used to check by convention. See DEVELOPING.md.

subprojects {
    // java-library, not plain java, so :client and :server can depend on :core with `api`
    // and re-expose its types the way the old single-tree code took for granted.
    apply plugin: 'java-library'

    group = 'net.minecraft'
    version = '1.0-dev'

    ext.brigadier = 'com.mojang:brigadier:1.3.10'

    repositories {
        mavenCentral()
        maven {
            name = 'mojang'
            url = uri('https://libraries.minecraft.net')
        }
    }

    // The game is built against, and must run on, Java 8. LWJGL 2.9.4 breaks on 21+.
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(8)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Decompiled sources are warning soup; silence it so real errors stand out.
        options.compilerArgs << '-nowarn'
        options.compilerArgs << '-Xlint:none'
    }

    dependencies {
        // fastutil + org.json, lifted verbatim out of the shipped jars so the
        // bytecode we build against is exactly what the mod was compiled against.
        implementation files(rootProject.file('libs/vendor-common.jar'))
    }
}
