// The shared game: blocks, items, entities, world generation, containers, recipes, the
// protocol, and the lang/struct resources both builds read.
//
// Nothing in here may reference net.minecraft.client or net.minecraft.server. That rule is
// what makes the split real rather than a naming convention, and the compiler enforces it:
// core does not depend on either module, so a reference simply will not resolve.
//
// Everything this module needs - the Java 8 toolchain, the repositories, and
// libs/vendor-common.jar - comes from the `subprojects` block in the root build.gradle.

// nightly versioning bc the build date is the version
def generatedVersionDir = layout.buildDirectory.dir('generated/sources/version')

tasks.register('generateBuildVersion') {
    group = 'build'
    description = 'Writes BuildVersion.java stamped with the current date'

    outputs.dir(generatedVersionDir)
    outputs.upToDateWhen { false }

    doLast {
        def date = java.time.LocalDate.now().format(java.time.format.DateTimeFormatter.ofPattern('ddMMyy'))
        def out = generatedVersionDir.get().file('net/minecraft/BuildVersion.java').asFile
        out.parentFile.mkdirs()
        out.text = """package net.minecraft;

public final class BuildVersion {
    public static final String DATE = "${date}";

    private BuildVersion() {
    }
}
"""
    }
}

sourceSets.main.java.srcDir generatedVersionDir

tasks.named('compileJava') {
    dependsOn 'generateBuildVersion'
}
